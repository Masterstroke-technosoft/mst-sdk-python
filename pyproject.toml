[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchain-sdk"
version = "1.0.0"
description = "A blockchain SDK development project (Python port)"
readme = "README.md"
license = { text = "ISC" }
requires-python = ">=3.9"
dependencies = [
    "web3>=6.15.0",
    "eth-account>=0.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]
